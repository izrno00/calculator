<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="placeholder">
        <div class="calc">
            <div class="screen">
                <div id="display"></div>
            </div>
            <div class="buttons">
                <div class="row">
                    <div class="digit" id="zero">0</div>
                    <div class="digit" id="dot">.</div>
                    <div class="operator" id="plus-minus">+/-</div>
                    <div class="equal orange" id="equal">=</div>
                </div>
                <div class="row">
                    <div class="digit" id="one">1</div>
                    <div class="digit" id="two">2</div>
                    <div class="digit" id="three">3</div>
                    <div class="operator orange" id="minus">-</div>
                </div>
                <div class="row">
                    <div class="digit" id="four">4</div>
                    <div class="digit" id="five">5</div>
                    <div class="digit" id="six">6</div>
                    <div class="operator orange" id="divide">/</div>
                </div>
                <div class="row">
                    <div class="digit" id="seven">7</div>
                    <div class="digit" id="eight">8</div>
                    <div class="digit" id="nine">9</div>
                    <div class="operator orange" id="multiply">X</div>
                </div>
                 <div class="row">
                    <div class="backspace" id="backspace" style="font-weight: 500;">&#9003;</div>
                    <div class="ac" id="ac">AC</div>
                    <div class="percent" id="percent">%</div>
                    <div class="operator orange" id="plus">+</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
